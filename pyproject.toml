[project]
name = "erpnext_pk"
authors = [
    { name = "ParaLogic", email = "info@paralogic.io" }
]
description = "ERPNext Pakistan Regional Customization: sales tax reporting and compliance"
requires-python = ">=3.14"
readme = "README.md"
dynamic = ["version"]
dependencies = [
    # frappe and erpnext are installed through bench
]

[build-system]
requires = ["flit_core >=3.4,<4"]
build-backend = "flit_core.buildapi"

[tool.bench.frappe-dependencies]
frappe = ">=16.0.0,<17.0.0"
erpnext = ">=16.0.0,<17.0.0"
